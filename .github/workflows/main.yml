# كاميرا بالفاصل الزمني (IntervalCam)

تطبيق أندرويد يلتقط صورة بالكاميرا الخلفية كل فترة تحددها (مثلاً كل ثانية أو ثانيتين)، ويستمر بالعمل أثناء استخدامك لتطبيقات أخرى، ويحفظ الصور في مجلد تختاره أنت (خارج المعرض).

## طريقة التشغيل
1. افتح مجلد `IntervalCam` في Android Studio (إصدار Koala أو أحدث) ودع Gradle يكمل المزامنة.
2. وصّل هاتفك (تصحيح USB) أو شغّل المحاكي، ثم اضغط Run.
3. في التطبيق: اكتب الفترة بالثواني (الحد الأدنى 0.5)، واختر مجلد الحفظ، ثم اضغط «بدء التصوير» وامنح إذن الكاميرا والإشعارات.
4. اخرج من التطبيق واعمل على ما تشاء. للإيقاف: زر «إيقاف» في الإشعار الدائم أو من التطبيق.

## ملاحظات
- الصور لا تظهر في المعرض لأنها تُحفظ في المجلد الذي تختاره عبر منتقي المجلدات (SAF). اختر مجلداً مثل Documents/IntervalCam. لا تختر Pictures أو DCIM إن أردت إبقاءها خارج المعرض.
- يعرض أندرويد 12+ نقطة خضراء في شريط الحالة عند استخدام الكاميرا، وهذا سلوك النظام ولا يمكن إخفاؤه.
- قد تتوقف الكاميرا عند إطفاء الشاشة في بعض الأجهزة، أو إذا فتحت تطبيقاً آخر يستخدم الكاميرا.
- لمنع النظام من إيقاف الخدمة، استثنِ التطبيق من «توفير البطارية».
- استخدمه على جهازك وفي الأماكن المسموح بها فقط.
- الكود لم يُبنَ ولم يُجرَّب هنا، فإن ظهر خطأ أثناء البناء أرسله لي وأصلحه.

